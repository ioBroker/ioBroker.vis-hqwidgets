<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80">
  <defs>
    <!-- the drum has square cells, the frame around it is rounded - so the cells are clipped by it -->
    <clipPath id="frame">
      <rect x="2" y="20" width="116" height="40" rx="5"/>
    </clipPath>
  </defs>
  <rect x="2" y="20" width="116" height="40" rx="5" fill="#151515" stroke="rgba(255,255,255,.25)"/>
  <g clip-path="url(#frame)">
    <!-- the last cell counts the tenths, as on a car -->
    <rect x="98.7" y="20" width="19.3" height="40" fill="#f0f0f0"/>
    <g stroke="rgba(255,255,255,.18)">
      <path d="M21.3 20v40M40.7 20v40M60 20v40M79.3 20v40M98.7 20v40"/>
    </g>
  </g>
  <g text-anchor="middle" dominant-baseline="central"
     font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#f5f5f5">
    <text x="11.7" y="40">1</text>
    <text x="31" y="40">2</text>
    <text x="50.3" y="40">3</text>
    <text x="69.7" y="40">4</text>
    <text x="89" y="40">5</text>
    <text x="108.3" y="40" fill="#151515">6</text>
  </g>
</svg>
